<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập | Khu Vực Riêng Tư</title>
  <meta name="description" content="Đăng nhập để truy cập dữ liệu và ghi chú riêng tư của tác giả." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-badge">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="auth-title">Khu Vực Riêng Tư</h1>
        <p class="auth-subtitle">Vui lòng đăng nhập để truy cập dữ liệu và ghi chú cá nhân</p>
      </div>

      <!-- Error Alert -->
      <div class="auth-alert error" id="loginAlert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginAlertText">Thông tin đăng nhập không chính xác!</span>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="usernameInput">Tên đăng nhập</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="usernameInput" placeholder="Nhập tên đăng nhập..." required autofocus autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Mật khẩu bảo mật</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." required autocomplete="current-password" />
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="Hiện/Ẩn mật khẩu">
              <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMeCheckbox" />
            <span>Ghi nhớ phiên đăng nhập</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập
        </button>
      </form>


      <a href="index.html" class="back-home-link">
        <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ Blog
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script>
    // Sync theme with main app
    const savedTheme = localStorage.getItem("devlog-theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);

    // If already authenticated, redirect to private portal
    if (DevLogAuth.isAuthenticated()) {
      window.location.href = "private.html";
    }

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const rememberMeCheckbox = document.getElementById("rememberMeCheckbox");
    const loginAlert = document.getElementById("loginAlert");
    const loginAlertText = document.getElementById("loginAlertText");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const togglePasswordIcon = document.getElementById("togglePasswordIcon");

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePasswordIcon.className = isPassword ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
    });

    // Handle Login Submit
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loginAlert.style.display = "none";

      const user = usernameInput.value;
      const pass = passwordInput.value;
      const remember = rememberMeCheckbox.checked;

      const result = DevLogAuth.login(user, pass, remember);
      if (result.success) {
        window.location.href = "private.html";
      } else {
        loginAlertText.textContent = result.message;
        loginAlert.style.display = "flex";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
